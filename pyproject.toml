[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tornet-lab"
version = "0.1.0"
description = "Tor control and SOCKS proxy utility for authorized testing"
requires-python = ">=3.9"
dependencies = [
    "requests[socks]>=2.31"
]

[project.scripts]
tornet-lab = "tornet.tornet:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
